<body>
    <h2>TodoList</h2>
    <h4>1.Take Class</h4>
    <h4>2. Go out to eat</h4>
    <h5>Timer:</h5>
    <h5 class="time">0</h5>
    <input type="text">
    <button>Add Todo</button>
    <script>
        let time = document.querySelector(".time");
        let count = 0;
        function Timer() {
            setInterval(() => {
                count++;
                time.innerText = count;
            }, 1000)
        }
        // Timer();
    </script>
