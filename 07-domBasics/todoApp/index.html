<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;

            margin-top: 20px;
            gap: 5vh;
        }

        h1 {
            text-align: center;
        }

        .tasks {
            display: flex;
            flex-wrap: wrap;
            gap: 5vw;

            div {
                margin-left: 2vw;
                width: 150px;
                height: 200px;
                background-color: aliceblue;
                border: 1px solid black;

                display: flex;
                ;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 5vh;

                button {
                    background-color: red;
                    color: white;
                    font-weight: bold;
                    padding: 10px;
                    border-radius: 20px;
                    border: 1px solid black;
                }
            }
        }

        input {
            border: 2px solid black;
            width: 70vw;
            border-radius: 10px;
            padding: 10px;
            margin-left: 4vw;
        }

        .ipwraper {
            display: flex;
            border-radius: 10px;
            gap: 10px;
        }

        .addTask {
            width: 20vw;
            border-radius: 10px;

            background-color: greenyellow;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Todo App</h1>
    <div class="tasks">
        <div>
            <h3>1- Go to Gym</h3>
            <button onclick="deleteTask(this)">Delete</button>
        </div>
        <div>
            <h3>2- Study</h3>
            <button onclick="deleteTask(this)">Delete</button>
        </div>

    </div>

    <div class="ipwraper">
        <input type=" text">
        <button onclick="addTask()" class="addTask">Add Task</button>

    </div>


    <script>

        function addTask() {
            let parentEl = document.querySelector(".tasks");
            let inp = document.querySelector("input");
            let wrapper = document.createElement("div");
            wrapper.innerHTML = `
            <h3>${inp.value}</h3>
            <button onclick="deleteTask(this)">Delete</button>
            `

            parentEl.appendChild(wrapper);
            inp.value = "";
        }

        function deleteTask(btn) {
            let div = btn.parentElement;
            div.remove();
        }
    </script>
</body>

</html>
